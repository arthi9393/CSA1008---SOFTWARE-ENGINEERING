<script>
    let isDark = false;
    let map;
    let markersLayer;
    let selectedTicketNo = null;

    // =====================================================
    // CIVICPULSE BACKEND
    // =====================================================
    // This connects the Officer Dashboard to the deployed
    // FastAPI backend on Render.
    const API_BASE = "https://csa1008-software-engineering.onrender.com/api";


    // =====================================================
    // PAGE LOAD
    // =====================================================
    window.onload = function () {

        // Create the Chennai map
        map = L.map('map').setView([13.0418, 80.2341], 13);

        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }
        ).addTo(map);

        // Layer used to store complaint markers
        markersLayer = L.layerGroup().addTo(map);

        // Load real complaint data
        loadDashboardData();
    };


    // =====================================================
    // LOAD DASHBOARD DATA
    // =====================================================
    async function loadDashboardData() {

        const tbody =
            document.getElementById('ticketTableBody');

        try {

            // Show loading message
            tbody.innerHTML = `
                <tr>
                    <td colspan="6"
                        class="text-center py-6 text-slate-400">
                        Loading database records...
                    </td>
                </tr>
            `;


            // =================================================
            // 1. LOAD KPI DATA
            // =================================================

            const kpiRes =
                await fetch(`${API_BASE}/kpi`);

            if (!kpiRes.ok) {
                throw new Error(
                    `KPI API error: ${kpiRes.status}`
                );
            }

            const kpiData =
                await kpiRes.json();

            console.log("KPI data:", kpiData);


            document.getElementById('kpiTotal').innerText =
                kpiData.total_grievances ?? 0;

            document.getElementById('kpiActive').innerText =
                kpiData.active_pending ?? 0;

            document.getElementById('kpiResolved').innerText =
                kpiData.resolved_today ?? 0;


            // =================================================
            // 2. LOAD GRIEVANCE RECORDS
            // =================================================

            const listRes =
                await fetch(`${API_BASE}/grievances`);

            if (!listRes.ok) {
                throw new Error(
                    `Grievance API error: ${listRes.status}`
                );
            }

            const tickets =
                await listRes.json();

            console.log(
                "Grievance records received:",
                tickets
            );


            // =================================================
            // 3. DISPLAY DATA
            // =================================================

            renderTableAndMap(tickets);


        } catch (err) {

            console.error(
                "Dashboard loading error:",
                err
            );


            // Display a proper error instead of
            // staying forever on "Loading..."
            tbody.innerHTML = `
                <tr>
                    <td colspan="6"
                        class="text-center py-8 text-red-500 font-semibold">

                        ❌ Unable to load database records.

                        <br>

                        <span class="text-xs text-slate-500">
                            Please check the Render backend connection.
                        </span>

                    </td>
                </tr>
            `;


            document.getElementById('kpiTotal').innerText =
                "--";

            document.getElementById('kpiActive').innerText =
                "--";

            document.getElementById('kpiResolved').innerText =
                "--";
        }
    }


    // =====================================================
    // RENDER TABLE AND MAP
    // =====================================================
    function renderTableAndMap(tickets) {

        const tbody =
            document.getElementById('ticketTableBody');

        tbody.innerHTML = '';

        // Remove old map markers
        markersLayer.clearLayers();


        // =================================================
        // NO RECORDS
        // =================================================

        if (!Array.isArray(tickets) ||
            tickets.length === 0) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="6"
                        class="text-center py-8 text-slate-400">

                        No grievance records found.

                    </td>
                </tr>
            `;

            return;
        }


        // =================================================
        // PROCESS EACH COMPLAINT
        // =================================================

        tickets.forEach(ticket => {


            // -------------------------------------------------
            // MAP MARKER COLOUR
            // -------------------------------------------------

            let color = '#ef4444';

            if (ticket.status === 'RESOLVED') {

                color = '#10b981';

            }
            else if (
                ticket.category === 'STREETLIGHT'
            ) {

                color = '#f59e0b';
            }


            // -------------------------------------------------
            // ADD MAP MARKER
            // -------------------------------------------------

            if (
                ticket.latitude !== null &&
                ticket.longitude !== null &&
                ticket.latitude !== undefined &&
                ticket.longitude !== undefined
            ) {

                const marker =
                    L.circleMarker(
                        [
                            Number(ticket.latitude),
                            Number(ticket.longitude)
                        ],
                        {
                            color: color,
                            radius: 9,
                            fillOpacity: 0.85
                        }
                    ).addTo(markersLayer);


                marker.bindPopup(`
                    <b>#${ticket.ticket_no}</b>
                    <br>
                    ${ticket.category || 'Unknown'}
                    <br>
                    ${ticket.ward_name || 'Ward not available'}
                    <br>
                    Status: ${ticket.status || 'SUBMITTED'}
                `);
            }


            // -------------------------------------------------
            // CREATE TABLE ROW
            // -------------------------------------------------

            const tr =
                document.createElement('tr');

            tr.className =
                "hover:bg-teal-50/60 cursor-pointer transition";


            tr.onclick = function () {

                openTicketModal(
                    ticket.ticket_no,
                    ticket.category,
                    ticket.ward_name,
                    ticket.description,
                    ticket.status
                );

            };


            // -------------------------------------------------
            // STATUS BADGE
            // -------------------------------------------------

            let statusBadge;


            if (ticket.status === 'RESOLVED') {

                statusBadge = `
                    <span
                        class="bg-emerald-100
                        text-emerald-800
                        text-[11px]
                        font-semibold
                        px-2.5
                        py-1
                        rounded-full
                        border
                        border-emerald-300">

                        Resolved ✅

                    </span>
                `;

            }
            else {

                statusBadge = `
                    <span
                        class="bg-amber-100
                        text-amber-800
                        text-[11px]
                        font-semibold
                        px-2.5
                        py-1
                        rounded-full
                        border
                        border-amber-300">

                        ${ticket.status || 'SUBMITTED'}

                    </span>
                `;
            }


            // -------------------------------------------------
            // TABLE CONTENT
            // -------------------------------------------------

            tr.innerHTML = `

                <td class="py-3.5 px-4
                    font-bold
                    text-teal-800
                    font-mono">

                    #${ticket.ticket_no}

                </td>


                <td class="py-3.5 px-4
                    font-bold
                    text-slate-900">

                    ${ticket.category || '-'}

                </td>


                <td class="py-3.5 px-4
                    text-slate-700">

                    ${ticket.ward_name || '-'}

                </td>


                <td class="py-3.5 px-4
                    font-mono
                    font-bold
                    text-amber-600">

                    ${ticket.severity || '-'}

                </td>


                <td class="py-3.5 px-4">

                    ${statusBadge}

                </td>


                <td class="py-3.5 px-4
                    text-right">

                    <button
                        class="px-3
                        py-1.5
                        rounded-xl
                        bg-[#1B3A5C]
                        text-white
                        text-[11px]
                        font-bold
                        shadow-sm">

                        Inspect

                    </button>

                </td>

            `;


            tbody.appendChild(tr);

        });
    }


    // =====================================================
    // OPEN TICKET MODAL
    // =====================================================
    function openTicketModal(
        ticketNo,
        title,
        loc,
        desc,
        status
    ) {

        selectedTicketNo = ticketNo;


        document.getElementById(
            'modalTicketId'
        ).innerText =
            `#${ticketNo}`;


        document.getElementById(
            'modalTitle'
        ).innerText =
            title || 'Complaint';


        document.getElementById(
            'modalLocation'
        ).innerText =
            loc || 'Location not available';


        document.getElementById(
            'modalDesc'
        ).innerText =
            `"${desc || 'Defect reported by citizen'}"`;


        document.getElementById(
            'ticketModal'
        ).classList.remove('hidden');
    }


    // =====================================================
    // CLOSE MODAL
    // =====================================================
    function closeModal() {

        document.getElementById(
            'ticketModal'
        ).classList.add('hidden');
    }


    // =====================================================
    // MARK COMPLAINT AS RESOLVED
    // =====================================================
    async function markResolvedAction() {

        if (!selectedTicketNo) {
            return;
        }


        try {

            const res =
                await fetch(
                    `${API_BASE}/grievances/${selectedTicketNo}/resolve`,
                    {
                        method: 'PATCH'
                    }
                );


            if (!res.ok) {

                throw new Error(
                    `Resolve API error: ${res.status}`
                );

            }


            const data =
                await res.json();

            console.log(
                "Resolve response:",
                data
            );


            alert(
                `🎉 Ticket #${selectedTicketNo} marked as RESOLVED in database!`
            );


            closeModal();


            // Reload dashboard so the
            // new status appears immediately
            loadDashboardData();


        } catch (err) {

            console.error(
                "Resolve error:",
                err
            );


            alert(
                "❌ Could not update the ticket. Please check the backend connection."
            );
        }
    }


    // =====================================================
    // DARK MODE
    // =====================================================
    function toggleTheme() {

        isDark = !isDark;


        const body =
            document.getElementById('pageBody');

        const header =
            document.getElementById('navHeader');

        const icon =
            document.getElementById('themeIcon');


        if (isDark) {

            body.className =
                "bg-slate-950 text-slate-100 min-h-screen flex flex-col transition-colors duration-300";

            header.className =
                "bg-slate-900 border-b border-slate-800 px-6 py-3.5 flex items-center justify-between shadow-sm sticky top-0 z-50";

            icon.className =
                "fa-solid fa-sun text-amber-400";

        }
        else {

            body.className =
                "bg-slate-100 text-slate-800 min-h-screen flex flex-col transition-colors duration-300";

            header.className =
                "bg-white border-b border-slate-200 px-6 py-3.5 flex items-center justify-between shadow-sm sticky top-0 z-50";

            icon.className =
                "fa-solid fa-moon text-slate-600";
        }
    }

                                   </script>
