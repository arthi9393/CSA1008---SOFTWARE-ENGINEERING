<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WeatherGPT</title>
<style>
  :root { --blue:#2563eb; --bg:#f4f6fb; --bubble-user:#2563eb; --bubble-bot:#ffffff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); }
  .app { max-width: 480px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; background:#fff; box-shadow: 0 0 24px rgba(0,0,0,0.06); }
  header { background: var(--blue); color: white; padding: 16px 20px; }
  header h1 { margin:0; font-size: 18px; }
  header p { margin: 2px 0 0; font-size: 12px; opacity: 0.85; }
  #messages { flex:1; overflow-y:auto; padding: 16px; display:flex; flex-direction:column; gap:10px; background: var(--bg); }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height:1.4; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--bubble-user); color: white; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bubble-bot); color:#111; border: 1px solid #e5e7eb; border-bottom-left-radius: 4px; }
  .msg.bot.alert { border-color:#f59e0b; background:#fffbeb; }
  form { display:flex; gap:8px; padding: 12px; border-top:1px solid #e5e7eb; }
  input { flex:1; padding: 10px 14px; border:1px solid #d1d5db; border-radius: 20px; font-size:14px; }
  button { background: var(--blue); color:white; border:none; border-radius:20px; padding: 0 18px; font-size:14px; cursor:pointer; }
  button:disabled { opacity: 0.5; }
  .hint { font-size:11px; color:#9ca3af; padding: 0 16px 8px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🌦️ WeatherGPT</h1>
    <p>Conversational weather, forecasts &amp; alerts</p>
  </header>
  <div id="messages"></div>
  <div class="hint">Try: "What's the weather in Chennai today?" · "3-day forecast for Coimbatore" · "any alerts near Chennai?"</div>
  <form id="chat-form">
    <input id="chat-input" type="text" placeholder="Ask about the weather…" autocomplete="off" required />
    <button id="send-btn" type="submit">Send</button>
  </form>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const form = document.getElementById('chat-form');
  const input = document.getElementById('chat-input');
  const sendBtn = document.getElementById('send-btn');

  function addMessage(text, who, isAlert=false) {
    const div = document.createElement('div');
    div.className = 'msg ' + who + (isAlert ? ' alert' : '');
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  addMessage("Hi! Ask me about current weather, a multi-day forecast, or active weather alerts for any location.", "bot");

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    addMessage(message, 'user');
    input.value = '';
    sendBtn.disabled = true;
    const thinking = addMessage('…', 'bot');

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message })
      });
      const data = await res.json();
      thinking.remove();
      const isAlert = data.alerts && data.alerts.length > 0;
      addMessage(data.reply || 'Sorry, something went wrong.', 'bot', isAlert);
    } catch (err) {
      thinking.remove();
      addMessage('Network error — is the backend running?', 'bot');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
